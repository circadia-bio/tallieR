      <rect x="23.16" y="3.02" width="3.51" height="5.68" rx="1.75" fill="#1E3A5F" stroke="none"/>

      <rect x="3.3"  y="10.61" width="3.51" height="5.68" rx="1.75" fill="#6B3FA0" stroke="none"/>
