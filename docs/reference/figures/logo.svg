<svg xmlns="http://www.w3.org/2000/svg" width="181" height="209" viewBox="0 0 680 785" role="img">
  <title>tallieR hex sticker</title>
  <desc>Hex sticker for the tallieR R package, showing an abacus on a light blue background with navy border</desc>

