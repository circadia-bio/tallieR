url: https://tallier.circadia-lab.uk

template:
  bootstrap: 5
  bslib:
    # ── Colours ──────────────────────────────────────────────────────────────
    bg:              "#EEF5FF"          # app background
    fg:              "#1E3A5F"          # deep navy  – body text & headings
    primary:         "#4A7BB5"          # blue       – links, buttons, navbar
    secondary:       "#94A3B8"          # slate      – muted text, meta
    success:         "#4A7BB5"
    info:            "#C8DFF5"          # light-blue – callout bg
    warning:         "#6B3FA0"          # questionnaire purple – badges, accents
    danger:          "#C0392B"

    # ── Fonts ─────────────────────────────────────────────────────────────────
    base_font:       {google: "Afacad"}
    heading_font:    {google: "Livvic"}
    code_font:       {google: "JetBrains Mono"}

    # ── Typography ────────────────────────────────────────────────────────────
    font-size-base:  "1rem"
    headings-font-weight: 700

    # ── Cards / surfaces ──────────────────────────────────────────────────────
    card-bg:         "#FFFFFF"
    card-border-color: "#E2EAF4"
    card-border-radius: "0.75rem"

    # ── Code blocks ───────────────────────────────────────────────────────────
    pre-bg:          "#1E3A5F"
    pre-color:       "#EEF5FF"

  includes:
    in_header: |
      <!-- tallieR custom CSS -->
      <style>
        /* ── Navbar ── */
        .navbar {
          background-color: #1E3A5F !important;
          border-bottom: 2px solid #4A7BB5;
        }
        .navbar .navbar-brand,
        .navbar-nav .nav-link,
        .navbar-nav .nav-link:hover,
        .navbar .navbar-toggler-icon,
        .navbar form .btn {
          color: #EEF5FF !important;
        }
        .navbar-nav .nav-link:hover { opacity: 0.8; }
        .navbar-nav .nav-link.active {
          color: #EEF5FF !important;
          border-bottom: 2px solid #6B3FA0;
        }
        .navbar small.nav-text { color: #6B3FA0 !important; }

        /* ── Navbar logo size ── */
        .navbar-brand img { height: 40px; width: auto; }

        /* ── Remove border under page title ── */
        .page-header { border-bottom: none !important; }

        /* ── Sidebar TOC links ── */
        .sidebar .nav-link,
        .sidebar a,
        #toc a,
        #toc .nav-link {
          color: #1E3A5F !important;
        }
        .sidebar .nav-link:hover,
        .sidebar a:hover,
        #toc a:hover {
          color: #4A7BB5 !important;
        }
        .sidebar .nav-link.active,
        #toc .nav-link.active {
          color: #4A7BB5 !important;
          border-left: 2px solid #6B3FA0;
          font-weight: 600;
        }

        /* ── Kill all text-muted on light backgrounds ── */
        .text-muted { color: #4A7BB5 !important; }

        /* ── Sidebar border ── */
        .sidebar { border-left: 3px solid #4A7BB5; padding-left: 1rem; }

        /* ── Reference index section headers ── */
        .reference-index h2 {
          color: #6B3FA0;
          font-size: 0.8rem;
          text-transform: uppercase;
          letter-spacing: 0.08em;
        }

        /* ── Inline code ── */
        code { color: #4A7BB5; background: #E2EAF4;
          border-radius: 4px; padding: 0.1em 0.35em; }

        /* ── Footer ── */
        .footer { background: #1E3A5F; color: #94A3B8; padding: 1.5rem 0; }
        .footer a { color: #C8DFF5; }

        /* ── Search ── */
        #search-input { border-color: #4A7BB5; }
      </style>

logo: man/figures/logo.svg
favicon: man/figures/favicon.svg

home:
  title: "tallieR — R tools for ScoreMe questionnaire data"
  description: >
    An R package for importing, re-scoring, and tidying questionnaire data
    collected with the ScoreMe app. Built by the Circadia Lab at
    Northumbria University.
  links:
  - text: ScoreMe app
    href: https://scoreme.circadia-lab.uk
  - text: Circadia Lab
    href: https://circadia-lab.uk
  sidebar:
    structure: [links, license, community, citation, authors, dev]

navbar:
  structure:
    left:  [intro, reference, articles, tutorials, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/getting-started.html
    github:
      icon: fab fa-github
      href: https://github.com/circadia-bio/tallieR
      aria-label: GitHub

reference:
- title: "Import"
  desc: "Read ScoreMe JSON exports into R."
  contents:
  - read_scoreme
  - read_scoreme_dir

- title: "Custom instruments"
  desc: "Load any ScoreMe-compatible JSON instrument spec for use in tallieR."
  contents:
  - load_instrument
  - load_instrument_dir

- title: "Tidy output"
  desc: "Reshape imported data into analysis-ready data frames."
  contents:
  - scores_wide
  - scores_long
  - items_long

- title: "Questionnaire scoring"
  desc: "Score and interpret validated instruments from raw item responses."
  contents:
  - score_questionnaire
  - score_all
  - interpret_score
  - available_instruments

- title: "Reliability"
  desc: "Internal consistency and reliability statistics."
  contents:
  - cronbach_alpha

- title: "Package"
  desc: "Package-level documentation."
  contents:
  - tallieR-package

articles:
- title: "Getting started"
  navbar: ~
  contents:
  - getting-started

news:
  releases:
  - text: "Changelog"
    href: news/index.html

authors:
  Lucas França:
    href: https://orcid.org/0000-0003-0853-1319
  Mario Leocadio-Miguel:
    href: https://orcid.org/0000-0002-7248-3529

footer:
  structure:
    left: [package, developed_by]
    right: [built_with]
  components:
    package: >
      **tallieR** — Circadia Lab, Northumbria University.
    developed_by: >
      Lucas França & Mario Leocadio-Miguel.
