      <rect x="14.16" y="19.74" width="3.51" height="5.68" rx="1.75" fill="#1E3A5F" stroke="none"/>
      <rect x="18.67" y="19.74" width="3.51" height="5.68" rx="1.75" fill="#1E3A5F" stroke="none"/>
      <rect x="23.18" y="19.74" width="3.51" height="5.68" rx="1.75" fill="#1E3A5F" stroke="none"/>

