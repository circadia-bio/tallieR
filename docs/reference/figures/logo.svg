      <line x1="1" y1="25.58" x2="29.9" y2="25.58" stroke="#EEF5FF" stroke-width="0.22" fill="none"/>

      <rect x="3.3"  y="3.02" width="3.51" height="5.68" rx="1.75" fill="#6B3FA0" stroke="none"/>
